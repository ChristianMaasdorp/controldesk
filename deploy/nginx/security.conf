# Hardening for a Laravel site served by nginx (Laravel Forge layout).
#
# Install as: /etc/nginx/forge-conf/<site>/server/security.conf
# (Forge includes server/* inside the server block, before its own
# "location ~ \.php$" block.) Then: sudo nginx -t && sudo service nginx reload
#
# Why: Forge's default config executes ANY .php file under public/, including
# files uploaded to storage/app/public (served via the public/storage symlink).
# That is how webshells uploaded as ticket attachments were run.

# 1. Only the Laravel front controller may execute PHP.
#    An exact-match location takes priority over every regex location,
#    so Forge's generic "\.php$" block below is never reached for index.php.
location = /index.php {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
}

# 2. Every other PHP-like file is refused outright (also catches
#    "shell.php/anything" path-info tricks and double extensions).
location ~* \.(php\d*|phtml|phar|pht|phps|inc)(/|$) {
    return 404;
}

# 3. User uploads are static files only, never code or active content.
#    "^~" stops nginx from checking regex locations for these URLs.
location ^~ /storage/ {
    location ~* \.(php\d*|phtml|phar|pht|phps|inc|html?|svg|js|htaccess)(/|$) {
        return 404;
    }

    # add_header here replaces the server-level headers, so repeat nosniff.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;

    try_files $uri =404;
}

# 4. Never serve dotfiles, env files, backups or VCS metadata.
location ~* (^|/)(\.env.*|.*\.bak.*|.*\.sql(\.gz)?|composer\.(json|lock)|\.git.*)$ {
    return 404;
}
